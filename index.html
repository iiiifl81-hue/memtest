<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>멤버놀이 성향 테스트</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#313338; --panel:#2b2d31; --deep:#1e1f22; --ink:#f2f3f5; --sub:#b5bac1; --line:#3f4147;
  --accent:#5865f2; --accent-hover:#4752c4; --green:#23a559; --bar:#404249; color-scheme:dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:20px 16px 56px}
h1,h2,h3{font-weight:700;margin:0;line-height:1.3}
.hidden{display:none!important}
.btn{display:block;width:100%;border:0;border-radius:8px;padding:13px 16px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;background:var(--accent);color:#fff;transition:background .15s}
.btn:hover{background:var(--accent-hover)}
.btn.ghost{background:var(--bar);color:var(--ink);margin-top:10px}
.btn.ghost:hover{background:#4e5058}
.top .btn{width:auto;margin:0;padding:7px 12px;font-size:14px;white-space:nowrap}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #00a8fc;outline-offset:2px}
.top-bar{display:flex;align-items:center;gap:10px;background:var(--deep);padding:12px 14px;border-radius:8px;margin-bottom:18px;font-weight:700;font-size:15px}
.top-bar i{width:10px;height:10px;border-radius:50%;background:var(--green)}
.intro{padding-top:6vh}
.intro h1{font-size:clamp(34px,10vw,46px);letter-spacing:-.01em}
.intro p{color:var(--sub);margin:14px 0 28px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.track{flex:1;height:8px;border-radius:99px;background:var(--bar);overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s}
.count{font-size:14px;color:var(--sub);min-width:40px;text-align:right}
.chat-head{display:flex;align-items:center;gap:8px;background:var(--deep);border-radius:8px 8px 0 0;padding:10px 14px;font-weight:700}
.hash{color:var(--sub);font-size:20px;line-height:1}
.feed{background:var(--panel);border-radius:0 0 8px 8px;padding:18px 14px;margin-bottom:14px;min-height:96px}
.msg{display:flex;gap:12px;align-items:flex-start}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px}
.msg .body{min-width:0}
.msg .nm{font-weight:600;font-size:15px;color:var(--c)}
.msg .nm small{color:var(--sub);font-weight:400;margin-left:8px;font-size:12px}
.msg .tx{margin-top:2px;line-height:1.55;word-break:keep-all;font-size:16px}
.dots{display:inline-flex;gap:4px;padding:6px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--sub);animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:13px 14px;font:inherit;font-size:15px;cursor:pointer;transition:background .12s,border-color .12s}
.opt:hover{background:#35373c;border-color:var(--accent)}
.opt:active{background:#3b3d44}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px 20px 22px;position:relative;overflow:hidden;text-align:center}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--tc,var(--accent))}
.spr{display:block;width:150px;height:105px;image-rendering:pixelated;margin:6px auto 8px}
.pos{display:inline-block;font-size:13px;font-weight:600;border:1.5px solid var(--tc,var(--accent));color:var(--ink);border-radius:99px;padding:2px 12px;margin:4px 0 12px}
.card h2{font-size:28px}
.desc{margin:12px 0 0;font-size:15.5px}
.meta{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);display:grid;gap:12px;font-size:14.5px}
.meta b{display:block;font-size:12.5px;color:var(--sub);font-weight:600}
.bars{margin:22px 0 20px;display:grid;gap:10px}
.bars h3{font-size:17px;margin-bottom:2px}
.gauge .name{font-size:14px;font-weight:600;margin-bottom:8px}
.gauge .rail{position:relative;height:8px;border-radius:99px;background:var(--bar)}
.gauge .rail::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--line)}
.gauge .dot{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--tc,var(--accent));border:3px solid var(--panel);transform:translate(-50%,-50%)}
.gauge .lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-top:6px}
.shot img{display:block;width:100%;height:auto;border-radius:12px;margin-top:14px;border:1px solid var(--line)}
.shot p{font-size:13.5px;color:var(--sub);margin:8px 0 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.dots i{animation:none}}
</style>
</head>
<body>
<main>
  <div class="top-bar"><i></i>멤버놀이 · 성향 테스트</div>
  <section id="intro" class="intro">
    <h1>멤버놀이<br>성향 테스트</h1>
    <p>일반형, 지존형, 명찰형, 반전형, 음침형, 무성향까지. 온라인에서 보이는 나와 마음속 두 가지를 따로 재서 내 성향을 알려줘요. 지인 1과 연락 상대가 보내는 메시지에 답장하면 돼요! (24문항)</p>
    <button class="btn" id="start">테스트 시작</button>
  </section>

  <section id="quiz" class="hidden" aria-live="polite">
    <div class="top">
      <button class="btn ghost hidden" id="back" type="button">← 이전</button>
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="count" id="count">1/24</div>
    </div>
    <div class="chat-head"><span class="hash">#</span><b id="chan">구함글-밴드</b></div>
    <div class="feed" id="feed"></div>
    <div class="opts" id="opts"></div>
  </section>

  <section id="result" class="hidden">
    <div class="card" id="card"></div>
    <div class="bars" id="bars"></div>
    <button class="btn" id="mkimg">결과 이미지 만들기</button>
    <div class="shot hidden" id="shot">
      <img id="shotimg" alt="내 멤버놀이 성향 결과 이미지">
      <p>이미지를 길게 눌러서 저장해도 돼요. (PC는 우클릭)</p>
      <button class="btn hidden" id="saveimg" type="button">이미지 파일로 저장</button>
    </div>
    <button class="btn ghost" id="again">다시 하기</button>
    <button class="btn ghost" id="copy">결과 텍스트 복사</button>
  </section>
</main>

  function drawSprite(ctx,x,y,px,key,color){
    var sp=SPR[key]||SPR.MID;
    var pal={k:"#111214",s:"#ffd9bd",h:"#4a3566",e:"#111214",p:"#ff9bb0",m:"#c0556b",a:color,w:"#ffffff",x:color};
    var rows=BASE.slice();
    HAIR[sp[0]].forEach(function(h){
      var r=rows[h[0]].split("");
      for(var i=0;i<14;i++){if(h[1].charAt(i)!==".")r[i]=h[1].charAt(i)}
      rows[h[0]]=r.join("");
    });
    var ex=EXPR[key]||["dot","base"];
    [EYE[ex[0]],MOUTH[ex[1]]].forEach(function(o){
      Object.keys(o).forEach(function(rn){
        var row=rows[rn].split("");
        for(var i=0;i<6;i++){row[4+i]=o[rn].charAt(i)}
        rows[rn]=row.join("");
      });
    });
    function put(grid,ox,oy){
      grid.forEach(function(row,ry){
        for(var cx=0;cx<row.length;cx++){
          var c=row.charAt(cx);
          if(c!=="."&&pal[c]){ctx.fillStyle=pal[c];ctx.fillRect(x+(ox+cx)*px,y+(oy+ry)*px,px,px)}
        }
      });
    }
    put(rows,0,0);
    put(ICON[sp[1]],15,1);
  }

  function rr(ctx,x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  }
  function wrapLines(ctx,text,maxW){
    var lines=[],line="";
    for(var i=0;i<text.length;i++){
      var ch=text.charAt(i),test=line+ch;
      if(ctx.measureText(test).width>maxW&&line){lines.push(line.trim());line=(ch===" ")?"":ch}
      else{line=test}
    }
    if(line.trim())lines.push(line.trim());
    return lines;
  }
  function paint(ctx,d,draw,W){
    var X=120,CW=W-240,y=130;
    function txt(str,x,yy,font,color,align){
      ctx.font=font;
      if(draw){ctx.fillStyle=color;ctx.textAlign=align||"left";ctx.textBaseline="top";ctx.fillText(str,x,yy)}
    }
    txt("멤버놀이 성향 테스트",W/2,y,"600 32px "+FF,"#b5bac1","center");y+=70;
    if(draw)drawSprite(ctx,W/2-60,y,6,d.k,d.t.color);y+=108;
    ctx.font="600 32px "+FF;
    var pw=ctx.measureText(d.t.pos).width+60;
    if(draw){rr(ctx,W/2-pw/2,y,pw,58,29);ctx.lineWidth=3;ctx.strokeStyle=d.t.color;ctx.stroke()}
    txt(d.t.pos,W/2,y+12,"600 32px "+FF,"#f2f3f5","center");y+=58+36;
    var fs=88;ctx.font="700 "+fs+"px "+HF;
    while(ctx.measureText(d.title).width>CW&&fs>40){fs-=4;ctx.font="700 "+fs+"px "+HF}
    txt(d.title,W/2,y,"700 "+fs+"px "+HF,"#f2f3f5","center");y+=fs+40;
    ctx.font="38px "+FF;
    wrapLines(ctx,d.t.desc,CW).forEach(function(l){txt(l,W/2,y,"38px "+FF,"#f2f3f5","center");y+=60});
    y+=20;
    [["이럴 때 빛남",d.t.good],["조심하면 좋은 점",d.t.care],["잘 맞는 유형",d.match],["피해야 할 유형",d.avoid]].forEach(function(m){
      txt(m[0],W/2,y,"600 28px "+FF,"#b5bac1","center");y+=42;
      ctx.font="34px "+FF;
      wrapLines(ctx,m[1],CW).forEach(function(l){txt(l,W/2,y,"34px "+FF,"#f2f3f5","center");y+=50});
      y+=24;
    });
    y+=10;
    txt("겉과 속의 위치",W/2,y,"700 44px "+HF,"#f2f3f5","center");y+=70;
    [["온라인에서 보이는 나",d.outer/MAXO],["마음속의 나",d.inner/MAXI]].forEach(function(g){
      txt(g[0],W/2,y,"600 30px "+FF,"#f2f3f5","center");y+=46;
      var pos=(Math.max(-1,Math.min(1,g[1]))+1)/2;
      if(draw){
        rr(ctx,X,y,CW,16,8);ctx.fillStyle="#404249";ctx.fill();
        ctx.beginPath();ctx.arc(X+CW*pos,y+8,22,0,Math.PI*2);
        ctx.fillStyle=d.t.color;ctx.fill();ctx.lineWidth=6;ctx.strokeStyle="#2b2d31";ctx.stroke();
      }
      y+=48;
      txt("팸/바텀",X,y,"26px "+FF,"#b5bac1");
      txt("탑/부치",X+CW,y,"26px "+FF,"#b5bac1","right");
      y+=58;
    });
    return y;
  }
  function renderImage(){
    var W=1080;
    var sc=document.createElement("canvas");sc.width=W;sc.height=10;
    var contentH=paint(sc.getContext("2d"),last,false,W);
    var H=contentH+120;
    var c=document.createElement("canvas");c.width=W;c.height=H;
    var ctx=c.getContext("2d");
    ctx.fillStyle="#1e1f22";ctx.fillRect(0,0,W,H);
    rr(ctx,60,60,W-120,H-120,48);ctx.fillStyle="#2b2d31";ctx.fill();
    ctx.lineWidth=3;ctx.strokeStyle="#1e1f22";ctx.stroke();
    ctx.save();rr(ctx,60,60,W-120,H-120,48);ctx.clip();
    ctx.fillStyle=last.t.color;ctx.fillRect(60,60,W-120,22);ctx.restore();
    paint(ctx,last,true,W);
    $("shotimg").src=c.toDataURL("image/png");
    last.blob=null;
    c.toBlob(function(b){last.blob=b},"image/png");
    try{
      if(window.claude&&window.claude.use){
        window.claude.use("downloads").then(function(d){if(d)$("saveimg").classList.remove("hidden")},function(){});
      }
    }catch(e){}
    $("shot").classList.remove("hidden");
    $("shot").scrollIntoView({behavior:"smooth",block:"start"});
  }
  $("saveimg").addEventListener("click",function(){
    if(!last||!last.blob||!window.claude||!window.claude.use)return;
    window.claude.use("downloads").then(function(d){
      if(d)return d.save({filename:"멤버놀이-성향-결과.png",data:last.blob});
    }).catch(function(){});
  });
  $("mkimg").addEventListener("click",function(){
    if(!last)return;
    var btn=this;btn.textContent="이미지 만드는 중...";
    var all=last.title+last.t.desc+last.t.good+last.t.care+last.match+last.avoid+last.t.pos+"멤버놀이 성향 테스트이럴 때 빛남조심하면 좋은 점잘 맞는 유형피해야 할 유형겉과 속의 위치온라인에서 보이는 나마음속의 나팸/바텀탑/부치";
    var ready=Promise.resolve();
    try{
      if(document.fonts&&document.fonts.load){
        ready=Promise.all([
          document.fonts.load('700 88px "Noto Sans KR"',all),
          document.fonts.load('400 38px "Noto Sans KR"',all),
          document.fonts.load('700 32px "Noto Sans KR"',all)
        ]).catch(function(){});
      }
    }catch(e){}
    ready.then(function(){
      try{renderImage()}catch(e){}
      btn.textContent="결과 이미지 다시 만들기";
    });
  });

  $("start").addEventListener("click",start);
  $("again").addEventListener("click",start);
  $("copy").addEventListener("click",function(){
    var btn=this,txt=btn.dataset.text||"";
    function done(){btn.textContent="복사됨";setTimeout(function(){btn.textContent="결과 텍스트 복사"},1500)}
    function fallback(){
      var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();
      try{document.execCommand("copy");done()}catch(e){}
      document.body.removeChild(ta);
    }
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fallback)}else{fallback()}
    }catch(e){fallback()}
  });
})();
</script>
</body>
</html>
